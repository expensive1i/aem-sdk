[project]
name = "aem-sdk"
dynamic = ["version"]
description = "Official Python library for AEM, the Africa Entelligence Marketplace"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["httpx>=0.25"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://marketplace.entelligence.africa"
Source = "https://github.com/expensive1i/aem-sdk"
Changelog = "https://github.com/expensive1i/aem-sdk/blob/main/CHANGELOG.md"
Issues = "https://github.com/expensive1i/aem-sdk/issues"

[project.optional-dependencies]
pandas = ["pandas>=2.0", "pyarrow>=15"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/aem/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aem"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
