# Publishes to PyPI when a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# Uses PyPI trusted publishing: PyPI trusts this workflow directly, so no
# PyPI password or token is stored anywhere. The tag must match the version
# in src/aem/_version.py, and the CI checks must pass first.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]" build twine
      - name: Tag matches the package version
        run: |
          version=$(python -c "import aem; print(aem.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the package version $version" >&2
            exit 1
          fi
      - name: Checks
        run: |
          ruff check .
          ruff format --check src tests
          mypy src tests
          pytest -q
      - name: Build
        run: python -m build
      - name: Check the package
        run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Matches the environment named in PyPI's trusted publisher settings.
    environment:
      name: pypi
      url: https://pypi.org/project/aem-sdk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
